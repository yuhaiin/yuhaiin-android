name: Android device regression

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  regression:
    name: API ${{ matrix.api }} (${{ matrix.page-size }} byte pages)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: google_apis
            page-size: 4096
          - api: 35
            target: google_apis_ps16k
            page-size: 16384

    steps:
      - uses: actions/checkout@v7

      - name: Resolve latest native build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          core_run=$(gh run list --repo yuhaiin/yuhaiin --branch main --workflow go.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$core_run" ]; then
            echo 'No successful upstream Go build found on main.' >&2
            exit 1
          fi
          echo "CORE_RUN_ID=$core_run" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: yuhaiin.aar
          path: yuhaiin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: yuhaiin/yuhaiin
          run-id: ${{ env.CORE_RUN_ID }}

      - uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin

      - uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Device regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            test "$(adb shell getconf PAGESIZE | tr -d '\r')" = "${{ matrix.page-size }}"
            ./gradlew :app:connectedDebugAndroidTest

      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-regression-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
