name: Android CI

# v2 branch: builds the v2 flavor (io.github.asutorufa.yuhaiin.v2) from the core's
# v2 AAR. It never tags, releases or touches the stable update channel; APKs are
# workflow artifacts only. Tags are not built here so a v2 commit can never
# become a stable release.
on:
  push:
    branches: ["v2"]
  pull_request:
    branches: ["v2"]

# Cancel superseded workflow runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          fetch-tags: "true"
          submodules: "recursive"

      - name: Resolve latest native build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORE_BRANCH: v2
        run: |
          python3 scripts/test-resolve-latest-core.py
          bash scripts/resolve-latest-core.sh >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ env.CORE_ARTIFACT_ID }}
          path: yuhaiin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: yuhaiin/yuhaiin
          run-id: ${{ env.CORE_RUN_ID }}

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate
        run: ./gradlew :app:lintV2Debug :app:testV2DebugUnitTest :app:assembleV2DebugAndroidTest

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_VERSION: ${{ format('v2-{0}', github.sha) }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$KEYSTORE_PATH"
          else
            unset KEYSTORE_PATH
          fi
          chmod +x gradlew
          ./gradlew :app:assembleV2Release --stacktrace
          python3 scripts/check-native-pages.py app/build/outputs/apk/v2/release/yuhaiin-v2-arm64-v8a-release*.apk
          python3 scripts/check-native-pages.py app/build/outputs/apk/v2/release/yuhaiin-v2-x86_64-release*.apk
          {
            echo "android.commit=$GITHUB_SHA"
            echo "core.commit=$CORE_COMMIT"
            echo "core.run=$CORE_RUN_ID"
            echo "core.artifact=$CORE_ARTIFACT_ID"
            sha256sum yuhaiin/yuhaiin.aar
            java -version 2>&1
          } > build-provenance.txt

      - name: Upload verification and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            app/build/reports
            build-provenance.txt

      - name: upload_arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: app-v2-arm64-v8a-release
          path: app/build/outputs/apk/v2/release/yuhaiin-v2-arm64-v8a-release*.apk
      - name: upload_x86_64
        uses: actions/upload-artifact@v7
        with:
          name: app-v2-x86_64-release
          path: app/build/outputs/apk/v2/release/yuhaiin-v2-x86_64-release*.apk
      - name: metadata.json
        uses: actions/upload-artifact@v7
        with:
          name: v2-metadata.json
          path: app/build/outputs/apk/v2/release/output-metadata.json
