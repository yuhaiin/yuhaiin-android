name: Android CI

on:
  push:
    branches: ["main"]
    tags: [v*]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          fetch-tags: "true"
          submodules: "recursive"

      - uses: actions/checkout@v7
        with:
          repository: yuhaiin/yuhaiin-rust
          path: yuhaiin-rust
          fetch-depth: "1"

      - uses: actions/checkout@v7
        with:
          repository: yuhaiin/yuhaiin-react
          path: yuhaiin-react
          fetch-depth: "1"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: yuhaiin-react/package-lock.json

      - name: Build management web UI
        working-directory: yuhaiin-react
        run: |
          npm ci
          npm run build

      - name: get run id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "GITHUB_RUN_ID=$(gh run list -b main -w Go -L 1 -R yuhaiin/yuhaiin -s success --json databaseId -q .[0].databaseId)" >> $GITHUB_ENV

      - uses: actions/download-artifact@v8
        with:
          name: yuhaiin.aar
          path: yuhaiin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: yuhaiin/yuhaiin
          run-id: ${{ env.GITHUB_RUN_ID }}

      - name: set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/27.2.12479018" >> "${GITHUB_ENV}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Build Rust Android runtime
        env:
          YUHAIIN_RUST_ROOT: ${{ github.workspace }}/yuhaiin-rust
        run: ./scripts/build-rust-native.sh

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        env:
          YUHAIIN_WEB_ROOT: ${{ github.workspace }}/yuhaiin-react/dist
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
        run: |
          echo ${KEYSTORE} | base64 -d > ${KEYSTORE_PATH}
          chmod +x gradlew
          ./gradlew app:assembleRelease --stacktrace

      - name: upload_arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/yuhaiin-arm64-v8a-release.apk
      - name: upload_x86_64
        uses: actions/upload-artifact@v7
        with:
          name: app-x86_64-release
          path: app/build/outputs/apk/release/yuhaiin-x86_64-release.apk
      - name: metadata.json
        uses: actions/upload-artifact@v7
        with:
          name: metadata.json
          path: app/build/outputs/apk/release/output-metadata.json

      - id: generate-release-notes
        if: github.event_name != 'pull_request'
        run: |
          previous_tag=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          if [ -n "${previous_tag}" ]; then
            git log "${previous_tag}..HEAD" --oneline > release_notes.txt
          else
            git log -n 100 --oneline > release_notes.txt
          fi
          sha256sum \
            app/build/outputs/apk/release/yuhaiin-x86_64-release.apk \
            app/build/outputs/apk/release/yuhaiin-arm64-v8a-release.apk \
            > checksums.txt

      - name: Update rolling main tag
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          git tag -f main "$GITHUB_SHA"
          git push origin refs/tags/main --force

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          body_path: release_notes.txt
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          draft: false
          make_latest: ${{ github.ref_type == 'tag' && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          overwrite_files: true
          # see: https://github.com/softprops/action-gh-release/issues/79#issuecomment-930339070
          files: |
            release_notes.txt
            checksums.txt
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/apk/release/yuhaiin-x86_64-release.apk
            app/build/outputs/apk/release/yuhaiin-arm64-v8a-release.apk
