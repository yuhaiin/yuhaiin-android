name: Android CI

on:
  push:
    branches: ["main"]
    tags: [v*]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"
          fetch-tags: "true"
          submodules: "recursive"

      - name: Verify pinned native source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          core_commit=$(sed -n 's/^core.commit=//p' yuhaiin/core-source.properties)
          core_run=$(sed -n 's/^core.workflowRun=//p' yuhaiin/core-source.properties)
          actual_commit=$(gh api "repos/yuhaiin/yuhaiin/actions/runs/$core_run" --jq '.head_sha')
          test "$actual_commit" = "$core_commit"
          echo "CORE_RUN_ID=$core_run" >> "$GITHUB_ENV"
          echo "CORE_COMMIT=$core_commit" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: yuhaiin.aar
          path: yuhaiin
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: yuhaiin/yuhaiin
          run-id: ${{ env.CORE_RUN_ID }}

      - name: Verify native artifact checksum
        run: |
          checksum=$(sed -n 's/^core.sha256=//p' yuhaiin/core-source.properties)
          printf '%s  %s\n' "$checksum" yuhaiin/yuhaiin.aar | sha256sum --check

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate
        run: ./gradlew :app:lintDebug :app:testDebugUnitTest

      - name: Build with Gradle
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$KEYSTORE_PATH"
          else
            unset KEYSTORE_PATH
          fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace
          python3 scripts/check-native-pages.py app/build/outputs/apk/release/yuhaiin-arm64-v8a-release*.apk
          python3 scripts/check-native-pages.py app/build/outputs/apk/release/yuhaiin-x86_64-release*.apk
          {
            echo "android.commit=$GITHUB_SHA"
            echo "core.commit=$CORE_COMMIT"
            echo "core.run=$CORE_RUN_ID"
            sha256sum yuhaiin/yuhaiin.aar
            java -version 2>&1
          } > build-provenance.txt

      - name: Upload verification and provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verification
          path: |
            app/build/reports
            build-provenance.txt

      - name: upload_arm64-v8a
        uses: actions/upload-artifact@v7
        with:
          name: app-arm64-v8a-release
          path: app/build/outputs/apk/release/yuhaiin-arm64-v8a-release*.apk
      - name: upload_x86_64
        uses: actions/upload-artifact@v7
        with:
          name: app-x86_64-release
          path: app/build/outputs/apk/release/yuhaiin-x86_64-release*.apk
      - name: metadata.json
        uses: actions/upload-artifact@v7
        with:
          name: metadata.json
          path: app/build/outputs/apk/release/output-metadata.json

      - id: generate-release-notes
        if: github.event_name != 'pull_request'
        run: |
          previous_tag=$(git describe --tags --match 'v*' --abbrev=0 2>/dev/null || true)
          if [ -n "${previous_tag}" ]; then
            git log "${previous_tag}..HEAD" --oneline > release_notes.txt
          else
            git log -n 100 --oneline > release_notes.txt
          fi
          sha256sum \
            app/build/outputs/apk/release/yuhaiin-x86_64-release*.apk \
            app/build/outputs/apk/release/yuhaiin-arm64-v8a-release*.apk \
            > checksums.txt

      - name: Update rolling main tag
        if: github.event_name == 'push' && github.ref_type == 'branch' && github.ref_name == 'main'
        run: |
          git tag -f main "$GITHUB_SHA"
          git push origin refs/tags/main --force

      - name: Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          body_path: release_notes.txt
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('main-{0}', github.sha) }}
          draft: false
          make_latest: ${{ github.ref_type == 'tag' && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
          overwrite_files: true
          # see: https://github.com/softprops/action-gh-release/issues/79#issuecomment-930339070
          files: |
            release_notes.txt
            build-provenance.txt
            checksums.txt
            app/build/outputs/apk/release/output-metadata.json
            app/build/outputs/apk/release/yuhaiin-x86_64-release*.apk
            app/build/outputs/apk/release/yuhaiin-arm64-v8a-release*.apk
