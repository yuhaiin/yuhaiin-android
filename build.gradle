import org.jetbrains.kotlin.gradle.dsl.JvmTarget
import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.4.21'
    repositories {
        google()
        // GitHub-hosted runners may receive HTTP 403 from Maven Central.
        // Use Google's Maven Central mirror in CI; keep Central as fallback.
        if (System.getenv('CI') == 'true') {
            maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        }
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath 'androidx.benchmark:benchmark-baseline-profile-gradle-plugin:1.5.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.21'
    }
}

allprojects {
    repositories {
        google()
        // GitHub-hosted runners may receive HTTP 403 from Maven Central.
        // Use Google's Maven Central mirror in CI; keep Central as fallback.
        if (System.getenv('CI') == 'true') {
            maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        }
        mavenCentral()
    }

    tasks.withType(KotlinCompile).configureEach {
        compilerOptions {
            jvmTarget.set(JvmTarget.JVM_17)
            freeCompilerArgs.add("-opt-in=kotlin.RequiresOptIn")
        }
    }
}
